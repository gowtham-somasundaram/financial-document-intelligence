[project]
name = "financial-document-intelligence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gowtham Somasundaram", email = "gowtham.s@agribazaar.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0.6",
